<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteLog</title>
    <style>
        :root { --primary: #4CAF50; --bg: #f4f7f6; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #333; font-size: 1.2rem; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .entry { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .entry-info { display: flex; flex-direction: column; }
        .entry-name { font-weight: bold; }
        .entry-meta { font-size: 0.8rem; color: #777; }
        .entry-cal { font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

    <div class="card">
        <h2>🍎 Log a Meal</h2>
        <input type="text" id="foodName" placeholder="What did you eat?">
        <input type="number" id="calories" placeholder="Calories (approx)">
        <select id="mealType">
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
            <option value="Snack">Snack</option>
        </select>
        <button onclick="addEntry()">Add Entry</button>
    </div>

    <div class="card">
        <h2>📅 Today's Log</h2>
        <div id="logList"></div>
        <hr>
        <div style="display: flex; justify-content: space-between; font-weight: bold;">
            <span>Total Calories:</span>
            <span id="totalCals">0</span>
        </div>
    </div>

    <script>
        let diary = JSON.parse(localStorage.getItem('foodDiary')) || [];

        function updateUI() {
            const list = document.getElementById('logList');
            const totalDisplay = document.getElementById('totalCals');
            list.innerHTML = '';
            let total = 0;

            diary.forEach((item, index) => {
                total += parseInt(item.calories);
                list.innerHTML += `
                    <div class="entry">
                        <div class="entry-info">
                            <span class="entry-name">${item.name}</span>
                            <span class="entry-meta">${item.type}</span>
                        </div>
                        <span class="entry-cal">${item.calories} kcal</span>
                    </div>
                `;
            });
            totalDisplay.innerText = total;
            localStorage.setItem('foodDiary', JSON.stringify(diary));
        }

        function addEntry() {
            const name = document.getElementById('foodName').value;
            const calories = document.getElementById('calories').value;
            const type = document.getElementById('mealType').value;

            if (name && calories) {
                diary.push({ name, calories, type });
                updateUI();
                document.getElementById('foodName').value = '';
                document.getElementById('calories').value = '';
            }
        }

        updateUI();
    </script>
</body>
</html>
